name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app scripts tests --select E,F,I,UP,B --line-length 99
      - name: Testes de API e serviços
        run: pytest --cov=app --cov-report=term-missing

  navegador:
    name: Testes de navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Testes de navegador (Playwright)
        run: pytest -m e2e
