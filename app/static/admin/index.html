<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbearia - Painel da Empresa</title>
  <link rel="stylesheet" href="/comum/base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topo">
    <div class="conteudo cabecalho">
      <div>
        <h1>Painel da Empresa</h1>
        <p class="sub">Agendamentos e cadastros &middot; horários de <span data-fuso>Manaus</span> &middot; <a href="/docs" target="_blank" rel="noopener">Swagger</a></p>
      </div>
      <div class="sessao">
        <span id="usuario-atual" class="ajuda"></span>
        <button id="sair" type="button" class="pequeno">Sair</button>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <div id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></div>

    <nav class="abas" aria-label="Seções">
      <button type="button" class="aba ativa" data-aba="agendamentos">Agendamentos</button>
      <button type="button" class="aba" data-aba="agenda">Agenda do dia</button>
      <button type="button" class="aba" data-aba="clientes" data-dono>Clientes</button>
      <button type="button" class="aba" data-aba="barbeiros" data-dono>Barbeiros</button>
      <button type="button" class="aba" data-aba="servicos" data-dono>Serviços</button>
      <button type="button" class="aba" data-aba="produtos" data-dono>Produtos</button>
      <button type="button" class="aba" data-aba="vendas" data-dono>Vendas</button>
      <button type="button" class="aba" data-aba="bloqueios">Bloqueios</button>
      <button type="button" class="aba" data-aba="relatorios" data-dono>Relatórios</button>
      <button type="button" class="aba" data-aba="usuarios" data-dono>Usuários</button>
    </nav>

    <section id="aba-agenda" class="painel" hidden>
      <div class="barra">
        <label>Dia <input id="agenda-data" type="date"></label>
        <button id="agenda-hoje" type="button" class="pequeno">Hoje</button>
        <button id="agenda-anterior" type="button" class="pequeno" aria-label="Dia anterior">&larr;</button>
        <button id="agenda-proximo" type="button" class="pequeno" aria-label="Dia seguinte">&rarr;</button>
        <span id="agenda-info" class="ajuda"></span>
      </div>
      <div id="agenda-colunas" class="agenda"></div>
    </section>

    <section id="aba-agendamentos" class="painel">
      <form id="form-filtro" class="grade-form">
        <label>Barbeiro <select id="filtro-barbeiro"></select></label>
        <label>Cliente
          <input id="filtro-cliente" list="lista-clientes" placeholder="nome, e-mail ou telefone" autocomplete="off">
          <datalist id="lista-clientes"></datalist>
        </label>
        <label>Dia <input id="filtro-data" type="date"></label>
        <label>Status
          <select id="filtro-status">
            <option value="">Todos</option>
            <option value="agendado">Agendado</option>
            <option value="concluido">Concluído</option>
            <option value="nao_compareceu">Faltou</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </label>
        <div class="acoes-filtro">
          <label class="inline"><input id="filtro-futuros" type="checkbox" checked> Só de hoje em diante</label>
          <button type="submit" class="primario pequeno">Filtrar</button>
          <button type="button" id="limpar-filtro" class="pequeno">Limpar</button>
          <button type="button" id="exportar-csv" class="pequeno">Exportar CSV</button>
        </div>
      </form>

      <div class="barra">
        <label class="inline"><input id="auto-atualizar" type="checkbox" checked> Atualizar automaticamente (10 s)</label>
        <button id="atualizar" type="button" class="pequeno">Atualizar agora</button>
      </div>

      <div class="paginacao">
        <button id="pag-anterior" type="button" class="pequeno">Anterior</button>
        <span id="pag-info" class="ajuda" aria-live="polite"></span>
        <button id="pag-proxima" type="button" class="pequeno">Próxima</button>
      </div>

      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr><th>#</th><th>Início</th><th>Fim</th><th>Cliente</th><th>Barbeiro</th><th>Serviços</th><th>Valor</th><th>Origem</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="lista-agendamentos"></tbody>
        </table>
      </div>
    </section>

    <section id="aba-clientes" class="painel" hidden></section>
    <section id="aba-barbeiros" class="painel" hidden></section>
    <section id="aba-servicos" class="painel" hidden></section>
    <section id="aba-produtos" class="painel" hidden></section>
    <section id="aba-vendas" class="painel" hidden></section>
    <section id="aba-bloqueios" class="painel" hidden></section>
    <section id="aba-relatorios" class="painel" hidden></section>
    <section id="aba-usuarios" class="painel" hidden></section>
  </main>

  <dialog id="dialogo-desativar" aria-labelledby="dialogo-titulo">
    <form method="dialog">
      <h2 id="dialogo-titulo"></h2>
      <div id="dialogo-corpo"></div>
      <div class="botoes-dialogo">
        <button id="dialogo-voltar" type="submit" value="voltar">Voltar</button>
        <button id="dialogo-confirmar" type="submit" value="confirmar" class="perigo">Desativar mesmo assim</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-remarcar" aria-labelledby="remarcar-titulo">
    <form method="dialog">
      <h2 id="remarcar-titulo">Remarcar agendamento</h2>
      <div class="grade-form">
        <label>Novo dia <input id="remarcar-data" type="date" required></label>
        <label>Novo horário <input id="remarcar-hora" type="time" required step="900"></label>
      </div>
      <div class="botoes-dialogo">
        <button type="submit" value="voltar">Voltar</button>
        <button type="submit" value="confirmar" class="primario">Remarcar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
